<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Enabled Q&A Application</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/css/styles.css">
</head>
<body>
    <div class="container">
        <header class="app-header">
            <h1 class="app-title">AI-Enabled Q&A</h1>
            <p class="app-description">Ask questions and get intelligent answers powered by AI with Retrieval-Augmented Generation</p>
        </header>
        
        <main>
            <!-- Question Form -->
            <form id="question-form" class="question-form">
                <div class="form-group">
                    <label for="question-input" class="form-label">Ask a Question</label>
                    <textarea id="question-input" class="form-input" 
                              placeholder="Enter your question here..." rows="4" required></textarea>
                </div>
                <button id="submit-btn" type="submit" class="btn btn-block">Ask Question</button>
            </form>
            
            <!-- Loader -->
            <div id="loader-container" class="loader-container">
                <div class="loader"></div>
                <span class="loading-text">Processing your question...</span>
            </div>
            
            <!-- Error Display -->
            <div id="error-container" class="error-container">
                <div id="error-text">An error occurred. Please try again.</div>
            </div>
            
            <!-- Answer Container -->
            <div id="answer-container" class="answer-container">
                <h3 class="answer-heading">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M12 16v-4"></path>
                        <path d="M12 8h.01"></path>
                    </svg>
                    Answer
                </h3>
                <div id="answer-text" class="answer-text"></div>
                
                <div id="sources-container" class="sources-container">
                    <h4 class="sources-heading">Sources:</h4>
                    <ul id="sources-list" class="sources-list"></ul>
                </div>
            </div>
            
            <!-- History Section -->
            <section id="history-container" class="history-container">
                <h2 class="history-title">Previous Questions</h2>
                <ul id="history-list" class="history-list">
                    <!-- History items will be added here -->
                </ul>
            </section>
        </main>
    </div>

    <script src="src/js/app.js"></script>
</body>
</html>
